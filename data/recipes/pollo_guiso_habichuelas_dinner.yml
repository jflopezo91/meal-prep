# Recipe: Pollo con Guiso y Habichuelas
# Based on R002 from Excel data
# Lunch with any carb; dinner without one.

id: pollo_guiso_habichuelas_dinner
name: "Pollo con guiso y habichuelas"
meal_types: [lunch, dinner]

tags:
  primary_protein: chicken

carbs:
  strategy: optional
  allowed: [rice, potato, yuca, platano_verde, platano_maduro, arepa, corn, pasta]
  default: rice

ingredients:
  # Protein - quantity resolved at planning time
  - item: chicken
    role: protein
    qty: "@portion"
    notes: "Pechuga desmechada"

  # Vegetables
  - item: tomato
    role: veg
    qty_g: 150

  - item: onion
    role: veg
    qty_g: 80

  - item: green_beans
    role: veg
    qty_g: 120

  - item: garlic
    role: veg
    qty_g: 10

  # Fat
  - item: olive_oil
    role: fat
    qty_ml: 10
