# Recipe: Ensalada de pollo con manzana

id: ensalada_pollo_manzana
name: "Ensalada de pollo con manzana"
meal_types: [lunch, dinner]
extend_to_dinner: true

tags:
  primary_protein: chicken

carbs:
  strategy: optional
  allowed: [rice, potato, yuca, platano_verde, platano_maduro]
  default: potato

ingredients:
  # Protein
  - item: chicken
    role: protein
    qty: "@portion"
    notes: "Pechuga"

  # Vegetables
  - item: red_bell_pepper
    role: veg
    qty_g: 120

  - item: green_bell_pepper
    role: veg
    qty_g: 130

  - item: celery
    role: veg
    qty_g: 120

  # Fruit
  - item: green_apple
    role: other
    qty_g: 180
    notes: "1 manzana verde con cáscara"

  # Dressing
  - item: mayonnaise
    role: condiment
    qty_g: 40

  - item: heavy_cream
    role: dairy
    qty_ml: 30

  - item: lemon
    role: condiment
    qty_units: 0.5
    notes: "El jugo"

  # Spices
  - item: thyme
    role: herb
    qty_g: 1

  - item: garlic_powder
    role: spice
    qty_g: 2

notes: "Ensalada fresca con pollo, vegetales crujientes y manzana"
