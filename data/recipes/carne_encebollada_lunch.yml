# Recipe: Carne Encebollada (Lunch Version)
# Based on R009 from Excel data

id: carne_encebollada_lunch
name: "Carne encebollada"
meal_types: [lunch]

tags:
  primary_protein: beef

# Variable carb strategy for lunch
carbs:
  strategy: optional
  allowed: [rice, potato, yuca, platano_verde, platano_maduro]
  default: rice

ingredients:
  # Protein
  - item: beef
    role: protein
    qty: "@portion"
    notes: "Lomo fino"

  # Vegetables
  - item: onion
    role: veg
    qty_g: 200
    notes: "Mucha cebolla"

  - item: garlic
    role: veg
    qty_g: 10

  - item: green_onion
    role: veg
    qty_g: 20

  - item: cilantro
    role: herb
    qty_g: 10

  # Spices & condiments
  - item: cumin
    role: spice
    qty_g: 2

  - item: achiote
    role: condiment
    qty_g: 5

  - item: panela
    role: condiment
    qty_g: 10
    notes: "Un toque para caramelizar la cebolla"

  # Fat
  - item: olive_oil
    role: fat
    qty_ml: 10

notes: "Receta clásica colombiana con abundante cebolla"
